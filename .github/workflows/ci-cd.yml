name: KBase CI/CD Pipeline

on:
  push:
    branches:
      - main 

jobs:
  # =========================================================
  # LUỒNG 1: ĐÓNG GÓI VÀ ĐẨY IMAGES LÊN DOCKER HUB
  # =========================================================
  build-and-push:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      
      - name: Create Frontend Env File
        run: |
          echo "NEXT_PUBLIC_API_BASE_URL=http://${{ secrets.EC2_HOST }}:8080" > FE/kbase-frontend/.env.production

      - name: Build and Push all services
        run: |
          docker compose build
          docker compose push

  # =========================================================
  # LUỒNG 2: TRIỂN KHAI LÊN EC2 (Chạy sau khi đã đẩy Docker xong)
  # =========================================================
  deploy-to-ec2:
    name: Deploy to AWS EC2
    needs: build-and-push 
    runs-on: ubuntu-latest
    steps:
      - name: Execute SSH Commands on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/kbase-deploy
            
            docker compose pull
            
            docker compose down
            docker compose up -d
            
            docker image prune -af

  # =========================================================
  # LUỒNG 3: TRIỂN KHAI CODE LÊN AWS LAMBDA
  # =========================================================
  deploy-lambda:
    name: Deploy to AWS Lambda
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Package Lambda ZIP
        working-directory: lambda/purge-expired-documents
        run: zip -r function.zip index.mjs

      - name: Update Lambda Code
        working-directory: lambda/purge-expired-documents
        run: |
          aws lambda update-function-code \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --zip-file fileb://function.zip

      - name: Update Lambda Environment Variables
        run: |
          aws lambda update-function-configuration \
            --function-name "${{ secrets.LAMBDA_FUNCTION_NAME }}" \
            --environment "Variables={API_BASE_URL=http://${{ secrets.EC2_HOST }}:8080,PURGE_SECRET=${{ secrets.KBASE_LAMBDA_PURGE_SECRET }}}"