spring.application.name=document-service
server.port=8083

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/document_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

aws.region=${AWS_REGION:us-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:kbase-documents}

services.project.base-url=${PROJECT_SERVICE_URL:http://localhost:8082}
lambda.purge.secret=${LAMBDA_PURGE_SECRET:change-this-lambda-purge-secret}

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka}
eureka.instance.prefer-ip-address=true

springdoc.api-docs.path=/api/documents/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
