spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          "[/**]":
            allowed-origins:
              - "http://localhost:3000"
              - "http://52.203.202.7:3000"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - "*"
            exposed-headers:
              - Authorization
              - X-User-Id
              - X-User-Role
            allow-credentials: true
            max-age: 3600
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/auth/**,/api/users/**
        - id: project-service
          uri: lb://project-service
          predicates:
            - Path=/api/projects/**
        - id: document-service
          uri: lb://document-service
          predicates:
            - Path=/api/documents/**

server:
  port: 8080

security:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-at-least-32-characters}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}

springdoc:
  swagger-ui:
    urls:
      - name: user-service
        url: /api/users/v3/api-docs
      - name: project-service
        url: /api/projects/v3/api-docs
      - name: document-service
        url: /api/documents/v3/api-docs
